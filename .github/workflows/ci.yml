# The checks every pull request has to pass before it is merged, and that run
# again on `main` after it is. The job names are the required status checks in
# the `main` ruleset: renaming one means updating the ruleset too.
#
# Nothing here can write: the workflow runs code from pull requests, so it gets
# a read-only token and no secrets. Releases are `release.yml`'s, on tags only.
# Every action is pinned by commit, with its version in a comment; Dependabot
# proposes the updates.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the previous run's answer moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the version and components from `rust-toolchain.toml`.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-
      # `--locked`: a lockfile the manifests disagree with fails, rather than
      # being rewritten on the runner.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The TPM stack the Linux daemon links against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtss2-dev pkg-config
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-
      # The Windows daemon does not build here. The Linux tests that need a
      # kernel, a TPM and root are `#[ignore]`d: the Docker testbed runs them.
      - run: cargo clippy --workspace --exclude windows-daemon --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude windows-daemon --locked

  # Licences, RustSec advisories and sources, against `deny.toml`.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # gitleaks as its image, pinned by digest: the official action asks an
  # organisation for a licence key, and the program itself does not.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history the commit scan walks.
          fetch-depth: 0
      - name: The tree as it stands
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" dir /repo --redact --no-banner
      # A secret added in one commit and removed in the next is gone from the
      # tree and still in the history.
      - name: The new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --log-opts="$range" --redact --no-banner
