[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/daemon",
    "crates/enrollment",
    "crates/identity",
    "crates/light-node",
    "crates/linux-daemon",
    "crates/local-discovery",
    "crates/member-store",
    "crates/programs",
    "crates/relay-server",
    "crates/roster",
    "crates/roster-sync",
    "crates/transport",
    "crates/transport-convesso",
    "crates/transport-wire",
    "crates/tunnel",
    "crates/windows-daemon",
]
# An Android client builds against these crates and is not one of them: it
# declares a workspace of its own, so nothing here needs it, or the NDK, to
# build — see `crates/daemon/tests/layout.rs`.

[workspace.package]
edition = "2024"
version = "0.5.1"
license = "AGPL-3.0-or-later"
# Built and shipped from here, as programs and packages; none of the crates
# goes to crates.io, and they depend on each other by path.
publish = false
# 1.95 because convesso, which `transport-convesso` binds, declares it. A
# declared minimum is relied on exactly when building on an older toolchain, so
# it follows the strictest crate in the tree.
rust-version = "1.95"

[workspace.dependencies]
# The transport, from its repository, fixed to one commit: a new one is taken on
# purpose, never by an update.
convesso-core = { git = "https://github.com/nohostalgia/convesso", rev = "f55e0a18d08938cbc2de657d19baf2b6702fd87a" }
convesso-stream = { git = "https://github.com/nohostalgia/convesso", rev = "f55e0a18d08938cbc2de657d19baf2b6702fd87a" }
convesso-tokio = { git = "https://github.com/nohostalgia/convesso", rev = "f55e0a18d08938cbc2de657d19baf2b6702fd87a" }
convesso-relay = { git = "https://github.com/nohostalgia/convesso", rev = "f55e0a18d08938cbc2de657d19baf2b6702fd87a" }
# Canonical CBOR. Chosen over serde-based codecs so encoding stays byte-exact and
# under our control.
minicbor = { version = "2.3.0", features = ["alloc"] }
# Without their `std` defaults, so the roster builds for a microcontroller
# (`no_std` + `alloc`); a crate that runs on an operating system asks for `std`.
blake3 = { version = "1.8.7", default-features = false }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
signature = "3.0.0"
# The shared pointer of a build without `std`, on any microcontroller: native
# atomics where the chip has them; where it has none (an ESP32-C3), what the
# firmware tells `portable-atomic` to use.
portable-atomic-util = { version = "0.2.8", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
tokio = { version = "1.48.0", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1.90"
zeroize = { version = "1.9.0", features = ["derive"] }

proptest = "1.11.0"
tempfile = "3.24.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
hex = "0.4.3"
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# Argon2 unoptimised is a hundred times slower, and the passphrase tests derive
# at the floor on every case. Optimised in debug builds too, so they run in
# seconds; release builds optimise it anyway.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The neighbour simulation scores every pair of five thousand members, which is
# seventy-five million hashes: minutes unoptimised, seconds optimised.
[profile.dev.package.blake3]
opt-level = 3

# Every signature a simulated network checks — tens of thousands of roots and
# proofs for ten thousand light members — goes through these: twenty minutes
# unoptimised (`daemon::simulator`).
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# A full member's layers and base are read through redb, every entry checked
# against its tree: a million boards' measurement is hours unoptimised.
[profile.dev.package.redb]
opt-level = 3
