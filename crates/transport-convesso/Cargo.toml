[package]
name = "transport-convesso"
description = "The convesso binding: the transport interface over convesso."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# A network and a relay in this process, for this crate's own tests. Off in any
# ordinary build.
fixture = ["dep:convesso-relay", "dep:rcgen", "dep:windows-sys"]

[dependencies]
# The frames, and a frame too large for a peer cut into parts.
transport-wire = { path = "../transport-wire" }
roster = { path = "../roster" }
transport = { path = "../transport" }
identity = { path = "../identity" }
convesso-core = { workspace = true, features = ["alloc", "ed25519-seed"] }
# The map from a convesso peer id back to the ed25519 key it is the X25519
# form of: what lets a handshake be judged by the roster's key index alone.
# The version ed25519-dalek already brings in.
curve25519-dalek = "=5.0.0"
convesso-stream = { workspace = true, features = ["alloc"] }
convesso-tokio = { workspace = true, features = ["stream", "tls"] }
async-trait.workspace = true
tokio.workspace = true
getrandom.workspace = true
# What the relay and a change of network did, for whoever collects the log.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The relay's key, written in its address as hexadecimal digits.
hex.workspace = true
convesso-relay = { workspace = true, optional = true }
# A self-signed certificate for a TLS-wrapped relay link in the fixture. TLS
# there authenticates nothing; the relay's pinned key is what is trusted.
rcgen = { version = "0.14", optional = true }

# The fixture's relay socket on Windows, which otherwise ends at the first
# datagram that could not be delivered.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"], optional = true }

[dev-dependencies]
proptest.workspace = true
# A microcontroller's sessions, held to this binding (`tests/light_sessions.rs`).
light-node = { path = "../light-node" }
# Depending on itself with the feature on is what makes `cargo test` enable it
# without a flag, while an ordinary build still cannot see it.
transport-convesso = { path = ".", features = ["fixture"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[lints]
workspace = true
