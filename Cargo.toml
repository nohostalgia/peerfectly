[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/daemon",
    "crates/enrollment",
    "crates/identity",
    "crates/linux-daemon",
    "crates/local-discovery",
    "crates/programs",
    "crates/rendezvous",
    "crates/rendezvous-server",
    "crates/roster",
    "crates/roster-sync",
    "crates/transport",
    "crates/transport-iroh",
    "crates/tunnel",
    "crates/windows-daemon",
]
# An Android client builds against these crates and is not one of them: it
# declares a workspace of its own, so nothing here needs it, or the NDK, to
# build — see `crates/daemon/tests/layout.rs`.

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
# Built and shipped from here, as programs and packages; none of the crates
# goes to crates.io, and they depend on each other by path.
publish = false
# 1.91 because `iroh` 1.1 and its tree require it — `iroh-base`, `iroh-dns`,
# `netwatch` and `portmapper` all declare it. The value here was 1.85 and was
# simply untrue: it only ever showed up when building on a toolchain older than
# the one this machine happens to have, which is exactly when a declared minimum
# is the thing being relied on.
rust-version = "1.91"

[workspace.dependencies]
# Canonical CBOR. Chosen over serde-based codecs so encoding stays byte-exact and
# under our control.
minicbor = { version = "2.3.0", features = ["alloc"] }
blake3 = "1.8.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
signature = "3.0.0"
rand_core = "0.10.1"
getrandom = "0.4.3"
tokio = { version = "1.48.0", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1.90"
zeroize = { version = "1.9.0", features = ["derive"] }

proptest = "1.11.0"
tempfile = "3.24.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
hex = "0.4.3"
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# Argon2 unoptimised is a hundred times slower, and the passphrase tests derive
# at the floor on every case. Optimised in debug builds too, so they run in
# seconds; release builds optimise it anyway.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The neighbour simulation scores every pair of five thousand members, which is
# seventy-five million hashes: minutes unoptimised, seconds optimised.
[profile.dev.package.blake3]
opt-level = 3
