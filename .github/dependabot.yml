# The workflows pin every action by commit, and `Cargo.lock` every crate, so
# nothing moves on its own. This proposes each update as a pull request, and CI
# runs on it like on any other change. Cargo is here because a pin that falls
# behind is otherwise found only by accident.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # One pull request a week for every compatible update, rather than one per
  # crate in a tree of four hundred; a new major version still comes alone.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]
