[package]
name = "tunnel"
description = "Addresses on the overlay, and the rule that a packet's source must match its session."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The device a host carries packets through. Without it the crate is
# `no_std` + `alloc`, the addressing rules alone, for a microcontroller member.
default = ["std"]
std = ["roster/std", "blake3/std", "dep:transport", "dep:async-trait", "dep:tokio"]

[dependencies]
roster = { path = "../roster", default-features = false }
transport = { path = "../transport", optional = true }
blake3.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
identity = { path = "../identity" }
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
