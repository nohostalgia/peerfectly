[package]
name = "local-discovery"
description = "Finding a peer on the same network, with no internet at all."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
roster = { path = "../roster" }
identity = { path = "../identity" }
# For the announcement payload. The same "key plus endpoint" the rendezvous
# carries, signed under a different context; a second copy of the format would
# drift, which this project has already had to correct once.
rendezvous = { path = "../rendezvous" }
blake3.workspace = true
getrandom.workspace = true
# A real AEAD rather than a bare stream cipher. The payload is already signed,
# so integrity is arguably covered — but relying on that means reasoning about
# malleability and a decoder fed attacker-chosen bytes, which is where this kind
# of design goes wrong.
chacha20poly1305 = "0.11"
tokio.workspace = true
# To set SO_REUSEADDR before binding. Several listeners must be able to join one
# multicast group and port on a host — two nodes side by side, or a node and a
# test — and tokio's `bind` gives no way to set it.
socket2 = "0.6"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[lints]
workspace = true
