[package]
name = "roster-sync"
description = "How two nodes reconcile their rosters over an authenticated session."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The sessions of a machine with an operating system. Without it the crate is
# `no_std` + `alloc`, the messages and the reconciliation, for a
# microcontroller member.
default = ["std"]
std = ["roster/std", "blake3/std", "dep:transport"]

[dependencies]
blake3.workspace = true
roster = { path = "../roster", default-features = false }
transport = { path = "../transport", optional = true }

[dev-dependencies]
identity = { path = "../identity" }
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
