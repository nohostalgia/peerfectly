# LOCAL ONLY. This crate depends on convesso by path, outside this repository,
# and convesso has no licence yet. It lives on the branch `convesso-transport`,
# which is not proposed for merging: a checkout of this repository alone cannot
# build it, and CI would fail `--locked` and `cargo-deny` on it. On that branch
# the daemon and the Android core run on it, in place of `transport-iroh`.
[package]
name = "transport-convesso"
description = "The convesso binding: the transport interface over convesso, as a local experiment."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# convesso's own minimum, above the workspace's.
rust-version = "1.95"

[features]
default = []
# A network and a relay in this process, for this crate's own tests. Off in any
# ordinary build.
fixture = ["dep:convesso-relay", "dep:rcgen"]

[dependencies]
roster = { path = "../roster" }
transport = { path = "../transport" }
identity = { path = "../identity" }
convesso-core = { path = "../../../../convesso/crates/convesso-core", features = ["alloc", "ed25519-seed"] }
convesso-stream = { path = "../../../../convesso/crates/convesso-stream", features = ["alloc"] }
convesso-tokio = { path = "../../../../convesso/crates/convesso-tokio", features = ["stream", "tls"] }
async-trait.workspace = true
tokio.workspace = true
getrandom.workspace = true
# What the relay and a change of network did, for whoever collects the log.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The relay's key, written in its address as hexadecimal digits.
hex.workspace = true
convesso-relay = { path = "../../../../convesso/crates/convesso-relay", optional = true }
# A self-signed certificate for a TLS-wrapped relay link in the fixture. TLS
# there authenticates nothing; the relay's pinned key is what is trusted.
rcgen = { version = "0.14", optional = true }

[dev-dependencies]
proptest.workspace = true
# Depending on itself with the feature on is what makes `cargo test` enable it
# without a flag, while an ordinary build still cannot see it.
transport-convesso = { path = ".", features = ["fixture"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[lints]
workspace = true
