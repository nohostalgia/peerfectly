# The relay, as one container.
#
#   docker compose -f deploy/server/compose.yaml up -d --build
#
# On a machine that cannot build, load an image built elsewhere and run without
# `--build`: see README.md.

services:
  relay:
    image: peerfectly-relay
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      # The relay, for devices: UDP, and TCP for networks where UDP does not pass.
      - "8443:8443/udp"
      - "8443:8443/tcp"
      # Its key, over HTTPS, for a device founding a network on this host.
      - "443:8444/tcp"
    volumes:
      # Its identity and its certificate, made on first start and kept.
      - relay-data:/data

volumes:
  relay-data:
